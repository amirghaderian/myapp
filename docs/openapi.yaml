openapi: 3.0.3
info:
  title: Movies API
  version: 1.0.0
  description: |
    Log in with `POST /auth/login` first. The server sets a `token` cookie,
    and the browser sends it automatically on the other requests.
servers:
  - url: /
tags:
  - name: General
  - name: Auth
  - name: Movies

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: token
  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        username: { type: string, example: amir }
        phone: { type: string, nullable: true, example: "09123456789" }
        name: { type: string, nullable: true, example: Amir }
        last_name: { type: string, nullable: true, example: Ghaderian }
    RegisterInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string, example: amir }
        password: { type: string, minLength: 6, example: secret123 }
        phone: { type: string, pattern: "^09\\d{9}$", example: "09123456789" }
        name: { type: string, example: Amir }
        last_name: { type: string, example: Ghaderian }
    LoginInput:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Username or phone number
          example: amir
        password: { type: string, example: secret123 }
    Movie:
      type: object
      properties:
        id: { type: integer, example: 1 }
        title: { type: string, example: Inception }
        imdb_id: { type: string, example: tt1375666 }
        genre: { type: string, example: Sci-Fi }
        year: { type: integer, nullable: true, example: 2010 }
    MovieInput:
      type: object
      required: [title, imdb_id, genre, year]
      properties:
        title: { type: string, example: Inception }
        imdb_id: { type: string, example: tt1375666 }
        genre: { type: string, example: Sci-Fi }
        year: { type: integer, example: 2010 }
  parameters:
    MovieId:
      in: path
      name: id
      required: true
      schema: { type: integer }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not logged in
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Already exists
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

paths:
  /:
    get:
      tags: [General]
      summary: Welcome message
      responses:
        "200":
          description: Welcome text
          content:
            text/html:
              schema: { type: string, example: welcome }

  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with username or phone
      description: Sets the `token` cookie on success.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Wrong username/phone or password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out
      description: Clears the `token` cookie.
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the logged-in user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /movies:
    get:
      tags: [Movies]
      summary: List movies
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: title
          schema: { type: string }
          description: Part of the title, case-insensitive
        - in: query
          name: year
          schema: { type: integer }
        - in: query
          name: sort
          schema: { type: string, enum: [year, id] }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: List of movies
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Movie" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Movies]
      summary: Add a movie
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MovieInput" }
      responses:
        "201":
          description: Movie created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Movie" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /movies/{id}:
    parameters:
      - $ref: "#/components/parameters/MovieId"
    get:
      tags: [Movies]
      summary: Get one movie
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The movie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Movie" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Movies]
      summary: Update a movie
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MovieInput" }
      responses:
        "200":
          description: Updated movie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Movie" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Movies]
      summary: Delete a movie
      security:
        - cookieAuth: []
      responses:
        "204":
          description: Movie deleted
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
